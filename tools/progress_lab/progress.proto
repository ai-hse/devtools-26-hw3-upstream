syntax = "proto3";

package progress;

service Progress {
  rpc GetState(TaskRequest) returns (TaskState);
  rpc Watch(TaskRequest) returns (stream Event);
}

message TaskRequest {
  string id = 1;
}

message Event {
  string task_id = 1;
  uint32 sequence = 2;
  string stage = 3;
  double created_at = 4;
}

message TaskState {
  string id = 1;
  string state = 2;
  repeated Event events = 3;
}
