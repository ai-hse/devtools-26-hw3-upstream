resolver 127.0.0.11 valid=2s ipv6=off;

upstream csv_api {
    zone csv_api 64k;
    server api:8099 resolve;
}

server {
    listen 80;
    client_max_body_size 8m;
    location / {
        proxy_pass http://csv_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
