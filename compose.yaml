services:
  api:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /data
      INSTANCE_NAME: csv-reports
      STARTUP_DELAY_SECONDS: "0"
    volumes:
      - reports:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s

  gateway:
    build:
      context: ./gateway
    ports:
      - "127.0.0.1:${WEB_PORT:-18090}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  reports: